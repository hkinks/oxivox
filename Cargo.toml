[package]
name = "rustle-dictation"
version = "0.1.0"
edition = "2024"
description = "Dictation for Linux: hotkey, themed overlay with live spectrogram, local whisper transcription"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rustle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fontdue = "0.9"
hound = "3"
notify = "8"
pipewire = "0.10"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = "0.21"
tiny-skia = "0.12"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whisper-rs = { version = "0.16", features = ["vulkan"] }

[profile.release]
opt-level = 3
lto = "thin"
