# Dictation key: press to start recording, press again to transcribe and paste.
bind = ALT, space, exec, oxivox toggle

# Escape cancels, but only while a dictation is active: the daemon enters the "oxivox" submap
# when recording starts and leaves it again at the end (set `cancel_submap = "oxivox"` in config.toml).
submap = oxivox
bind = , escape, exec, oxivox cancel
submap = reset
