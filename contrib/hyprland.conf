# Dictation key: press to start recording, press again to transcribe and paste.
bind = ALT, space, exec, rustle toggle

# Escape cancels, but only while a dictation is active: the daemon enters the "rustle" submap
# when recording starts and leaves it again at the end (set `cancel_submap = "rustle"` in config.toml).
submap = rustle
bind = , escape, exec, rustle cancel
submap = reset
